<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="dz-title dz-desc">
  <title id="dz-title">DZ monogram</title>
  <desc id="dz-desc">A capital D with a Z carved through its bowl; the negative space forms the second letter.</desc>
  <defs>
    <mask id="carve">
      <rect width="32" height="32" fill="white"/>
      <path d="M11 9.5 H23 L11 21 H23" fill="none" stroke="black" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/>
    </mask>
  </defs>
  <rect width="32" height="32" fill="#0a0a0a"/>
  <path d="M5.5 5 H10.5 C20.5 5 26.5 10 26.5 16 C26.5 22 20.5 27 10.5 27 H5.5 Z" fill="#ebebeb" mask="url(#carve)"/>
</svg>
